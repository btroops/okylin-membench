schema_version: 1
case_id: rel-01-contradictory
dimension: dynamic_update
title: 矛盾型关系（直接 conflict）
description: 同一槽位的两个 session 信息直接矛盾。智能体应取后者；旧值只在演替时间线上允许。
difficulty: hard
tags:
- subtleMemory
- contradictory
- 关系
fact_lifecycle:
- value: 北京市海淀区中关村大街1号
  valid_from: s1
  valid_until: s2
sessions:
- session_id: s1
  turns:
  - 我家在北京市海淀区中关村大街1号。
- session_id: s2
  turns:
  - 我搬到上海市浦东新区世纪大道100号了。
probes:
- probe_id: p1
  type: slot
  after_session: s2
  question: 我家在哪里？
  relation: contradictory
  expected:
    must_include:
    - 上海市浦东新区世纪大道100号
    must_not_include:
    - 北京市海淀区中关村大街1号
    superseded_values:
    - 北京市海淀区中关村大街1号
- probe_id: p2
  type: free
  after_session: s2
  question: 我最早和你说住在哪里？
  relation: contradictory
  expected:
    any_include:
    - 中关村
    - 北京市
    - 海淀
  note: 历史值追溯；SubtleMemory nuanced 关系辨别的关键能力

# 任务复用：把规范落进实际产物（文件系统证据）
schema_version: 1
case_id: reuse-02-commit-rule
dimension: task_reuse
title: 提交信息规范复用（行动轨迹）
description: 之前教过的提交信息规范应被应用到实际生成的文件中；用 fs 探针检查行动产物。
difficulty: hard
tags: [规范, 行动轨迹, 文件]
sessions:
  - session_id: s1
    turns:
      - "记住我们的提交信息规范：提交信息必须以 KYLIN- 开头加三位数字。"
  - session_id: s2
    turns:
      - "/write commit-msg.txt 按照我之前教你的提交信息规范，生成一条修复登录崩溃的提交信息"
probes:
  - probe_id: p1
    type: fs
    after_session: s2
    expected:
      file_exists: ["commit-msg.txt"]
      file_contains:
        commit-msg.txt: "KYLIN-[0-9]{3}"

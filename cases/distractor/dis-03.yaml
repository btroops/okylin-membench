# 相近区分：真实姓名 vs 常用昵称
schema_version: 1
case_id: dis-03-name-nickname
dimension: distractor_discrimination
title: 姓名与昵称
description: 同指一人但用途不同的两条信息，须按问法区分。
difficulty: medium
tags: [相似干扰, 身份]
sessions:
  - session_id: s1
    turns:
      - "我叫张伟，常用昵称是 Aiden。"
probes:
  - probe_id: p1
    type: slot
    after_session: s1
    question: "我的昵称是什么？"
    expected:
      must_include: ["Aiden"]
      must_not_include: ["张伟"]
  - probe_id: p2
    type: slot
    after_session: s1
    question: "我的真实姓名是什么？"
    expected:
      must_include: ["张伟"]
      must_not_include: ["Aiden"]

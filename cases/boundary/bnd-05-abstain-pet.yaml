# 边界识别（拒答，对标 LongMemEval abstention）：从未说过的信息不得编造
schema_version: 1
case_id: bnd-05-abstain-pet
dimension: boundary_refusal
title: 从未提及的宠物应拒答
description: 全程未说过任何宠物，探针问"我的鹦鹉叫什么"——正确行为是承认没听过，编造名字即失败。
difficulty: medium
tags: [拒答, 防幻觉]
sessions:
  - session_id: s1
    turns:
      - "今天天气不错，帮我看看日历。"
  - session_id: s2
    turns:
      - "中午吃了个三明治。"
probes:
  - probe_id: p1
    type: free
    after_session: s2
    question: "我的鹦鹉叫什么名字？"
    expected:
      any_include: ["不知道", "没说过", "没有说过", "没提到", "没有提到",
                    "不记得", "不清楚", "没有记录", "不确定", "无可奉告",
                    "没有养过", "没养过"]
    note: LongMemEval abstention 设计：不存在的信息，正确行为是拒答

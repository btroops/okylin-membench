# 记忆调用：用记住的名字执行个性化动作
schema_version: 1
case_id: rec-02-greeting
dimension: recall
title: 个性化称呼调用
description: 记住的姓名要能在"打招呼"这类动作中主动使用。
difficulty: easy
tags: [身份, 应用]
sessions:
  - session_id: s1
    turns:
      - "我叫小明。"
  - session_id: s2
    turns:
      - "今天有点累。"
probes:
  - probe_id: p1
    type: free
    after_session: s2
    question: "请用我的名字跟我打个招呼。"
    expected:
      must_include: ["小明"]

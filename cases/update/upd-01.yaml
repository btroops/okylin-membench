# 动态更新（dynamic_update）：新信息出现后正确覆盖旧信息
schema_version: 1
case_id: upd-01-address
dimension: dynamic_update
title: 搬家后地址更新
description: 新地址应覆盖旧地址；回答中再出现旧地址即判定为混淆。
difficulty: easy
tags: [地址, 冲突]
sessions:
  - session_id: s1
    turns:
      - "我家在北京市海淀区中关村大街1号。"
  - session_id: s2
    note: 一周后
    turns:
      - "我搬到上海市浦东新区世纪大道100号了。"
probes:
  - probe_id: p1
    type: slot
    after_session: s2
    evidence_sessions: ["s2"]
    question: "我现在家在哪里？"
    expected:
      must_include: ["上海市浦东新区世纪大道100号"]
      must_not_include: ["北京市海淀区中关村大街1号"]
      superseded_values: ["北京市海淀区中关村大街1号"]

# 动态更新：工具偏好变更
schema_version: 1
case_id: upd-03-editor
dimension: dynamic_update
title: 默认编辑器变更
description: 偏好类信息的更新，检查是否仍沿用旧偏好。
difficulty: easy
tags: [偏好, 冲突]
sessions:
  - session_id: s1
    turns:
      - "我用 vim 作为默认编辑器。"
  - session_id: s2
    turns:
      - "我改用 emacs 了，以后默认编辑器换成 emacs。"
probes:
  - probe_id: p1
    type: slot
    after_session: s2
    evidence_sessions: ["s2"]
    question: "我的默认编辑器是什么？"
    expected:
      must_include: ["emacs"]
      must_not_include: ["vim"]
